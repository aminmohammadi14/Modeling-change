name: REVCS package and validation
on:
  push:
    branches: ['revcs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original version checksums
        working-directory: versions/REVCS19
        run: sha256sum -c SHA256SUMS.txt
      - name: Build complete source package
        run: python3 scripts/package.py
      - name: Upload downloadable source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: REVCS-source-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - uses: julia-actions/cache@v2
      - name: Install pinned environment
        run: julia --project=versions/REVCS19 -e 'using Pkg; Pkg.instantiate()'
      - name: Execute numeric regression tests
        id: tests
        shell: bash
        run: |
          mkdir -p .ci-report
          failed=0
          for name in growth certified native audit repair worst_scenario physical_symbolic; do
            if julia --project=versions/REVCS19 "versions/REVCS19/test_${name}19.jl" > ".ci-report/${name}.log" 2>&1; then
              echo "PASS ${name}" | tee -a .ci-report/summary.txt
            else
              echo "FAIL ${name}" | tee -a .ci-report/summary.txt
              failed=1
            fi
          done
          exit "$failed"
      - name: Record CI outcome
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p .ci-report
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          Path('.ci-report/status.json').write_text(json.dumps({
            'commit': os.environ['COMMIT_SHA'],
            'tests_outcome': os.environ['TEST_OUTCOME'],
            'full_paper_reproduction': False
          }, indent=2))
          PY
      - name: Upload validation logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REVCS-validation-${{ github.sha }}
          path: .ci-report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  rebuild-step01:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia: ['1.10.10', '1.12', '1.13.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Verify step package checksums
        shell: bash
        working-directory: versions/REBUILD_S01
        run: sha256sum -c SHA256SUMS.txt
      - name: Validate source data and build input figures
        shell: bash
        run: |
          set -o pipefail
          mkdir -p step01-results
          julia --depwarn=error versions/REBUILD_S01/test_step01.jl 2>&1 | tee step01-results/tests.log
          julia --depwarn=error versions/REBUILD_S01/test_repl_step01.jl 2>&1 | tee step01-results/repl_tests.log
          julia versions/REBUILD_S01/run_step01.jl versions/REBUILD_S01 step01-results
          mkdir -p singlefile-only
          cp versions/REBUILD_S01/revcs_step01_integrated.jl singlefile-only/
          julia --depwarn=error singlefile-only/revcs_step01_integrated.jl 2>&1 | tee step01-results/singlefile.log
          julia --depwarn=error -e 'include(ARGS[1])' singlefile-only/revcs_step01_integrated.jl 2>&1 | tee step01-results/singlefile_include.log
          julia --depwarn=error scripts/test_reference_s01.jl 2>&1 | tee step01-results/reference_tests.log
          mkdir -p reference-only
          cp versions/REFERENCE_S01/CODE_REFERENCE.jl reference-only/
          julia --depwarn=error reference-only/CODE_REFERENCE.jl 2>&1 | tee step01-results/reference_run.log
          julia --depwarn=error -e 'include(ARGS[1])' reference-only/CODE_REFERENCE.jl 2>&1 | tee step01-results/reference_include.log
      - name: Upload step results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REBUILD-S01-results-${{ matrix.os }}-julia-${{ matrix.julia }}-${{ github.sha }}
          path: |
            step01-results/
            singlefile-only/results_S01/
            reference-only/results_REFERENCE_S01/
          if-no-files-found: error
          retention-days: 90

  g742-fix20:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, julia: '1.10.10'}
          - {os: windows-latest, julia: '1.13.1'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Verify archive and test both multi-column Farkas branches
        shell: bash
        working-directory: versions/G742_FIX20
        run: |
          set -o pipefail
          sha256sum -c SHA256SUMS.txt
          python ../../scripts/package_fix20.py
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          for t in test_fix20 test_status21 test_oracle21 test_recovery test_physical_matrices; do
            julia --project=. "$t.jl" 2>&1 | tee -a fix20-tests.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G742-FIX20-${{ matrix.os }}-${{ github.sha }}
          path: |
            versions/G742_FIX20/REVCS19_FIX20_complete.zip
            versions/G742_FIX20/fix20-tests.log
